<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Shar — каталог, мобільна</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="react.production.min.js"></script>
<script src="react-dom.production.min.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Onest:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Rubik+Spray+Paint&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#D9E2E7}
a{color:#26303A;text-decoration:none}a:hover{color:#46596A}
button{cursor:pointer;transition:border-color .15s,background-color .15s,color .15s}
.cta:active{background:#3A4B59 !important}
:focus-visible{outline:2px solid #46596A;outline-offset:2px}
.h{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.01em;margin:0}
.mono{font-family:'JetBrains Mono',monospace}
.lbl{font-family:'JetBrains Mono',monospace;font-size:11px;color:#56636E}
html{scroll-behavior:smooth}
a,button,input,select,label{transition:color .2s,background-color .2s,border-color .2s,box-shadow .2s,transform .2s,opacity .2s}
button:active,.cta:active{transform:scale(.97)}
@keyframes pagein{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes popin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(48px)}to{opacity:1;transform:none}}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}
@keyframes sprayin{from{opacity:0;transform:scale(.8) rotate(-14deg)}}
.page{animation:pagein .7s cubic-bezier(.2,.7,.2,1) backwards}
.pop{animation:popin .32s cubic-bezier(.2,.7,.2,1) backwards}
.kb{animation:kb 16s cubic-bezier(.2,.7,.2,1) both}
.spray{animation:sprayin .9s .45s cubic-bezier(.2,.7,.2,1) both}
.card img{transition:transform .6s cubic-bezier(.2,.7,.2,1)}.card:hover img{transform:scale(1.04)}
@supports (animation-timeline: view()){.reveal{animation:rise linear both;animation-timeline:view();animation-range:entry 0% cover 22%}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important;scroll-behavior:auto !important}}
.onph,.onph a{color:#EDEDEB}.onph a:hover{color:#E2D5CD}.onph .spray{color:#B05600}
</style>
</helmet>
<div class="page" style="width: 390px; min-height: 2600px; background: #D9E2E7; color: #26303A; font-family: 'Onest', sans-serif">

<header style="height: 64px; padding: 0 8px 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #C3CED5">
<a href="Mobile-Main.dc.html" class="h" style="font-size: 24px; font-weight: 700; letter-spacing: 0.08em">SHAR</a>
<div style="display: flex; align-items: center; gap: 4px">
<div role="group" aria-label="{{mm.lang}}" style="display: flex; border: 1px solid #C3CED5; border-radius: 18px; overflow: hidden">
<button onClick="{{setUk}}" aria-pressed="{{isUk}}" style="height: 40px; width: 40px; border: none; background: {{ukBg}}; color: {{ukFg}}; font-family: 'JetBrains Mono', monospace; font-size: 12px">UA</button>
<button onClick="{{setEn}}" aria-pressed="{{isEn}}" style="height: 40px; width: 40px; border: none; background: {{enBg}}; color: {{enFg}}; font-family: 'JetBrains Mono', monospace; font-size: 12px">EN</button>
</div>
<a href="Mobile-Cart.dc.html" aria-label="{{mm.cart}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 8h14l-1 12H6z"></path><path d="M9 8a3 3 0 0 1 6 0"></path></svg><span class="mono" style="position: absolute; top: 6px; right: 4px; background: #46596A; color: #F5F2EF; font-size: 10px; border-radius: 999px; padding: 0 5px">{{cartCount}}</span></a>
<button onClick="{{toggleMenu}}" aria-expanded="{{menuOpen}}" aria-label="{{mm.menu}}" style="width: 44px; height: 44px; background: none; border: none; color: {{menuColor}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
</div>
</header>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
<nav class="pop" aria-label="{{mm.menu}}" style="padding: 4px 16px 16px; border-bottom: 1px solid #C3CED5; display: flex; flex-direction: column">
<sc-for list="{{menuItems}}" as="m" hint-placeholder-count="4">
<a data-dc-href="{{m.href}}" aria-current="{{m.cur}}" style="min-height: 56px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #C3CED5; font-family: 'Oswald', sans-serif; text-transform: uppercase; font-size: 24px; color: {{m.color}}">{{m.label}}<span aria-hidden="true">→</span></a>
</sc-for>
</nav>
</sc-if>

<div style="padding: 20px 16px 0">
<nav aria-label="{{t.crumbs}}" class="mono" style="font-size: 11px; color: #56636E; display: flex; gap: 6px"><a href="Mobile-Main.dc.html" style="color: #56636E">{{t.home}}</a><span>/</span><span>{{t.title}}</span></nav>
<h1 class="h" style="font-size: 48px; font-weight: 700; line-height: 1; margin-top: 12px">{{t.title}}</h1>
</div>

<div role="group" aria-label="{{t.scenario}}" style="display: flex; gap: 8px; padding: 20px 16px 0; overflow-x: auto">
<sc-for list="{{scenarios}}" as="s" hint-placeholder-count="5">
<button onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="flex-shrink: 0; height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid {{s.border}}; background: {{s.bg}}; color: {{s.fg}}; font-family: 'Onest', sans-serif; font-size: 14px">{{s.label}}</button>
</sc-for>
</div>

<div style="padding: 16px 16px 0">
<label style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 12px; border: 1px solid #AEBCC5; border-radius: 12px; background: #E6ECEF"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#56636E" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input type="search" value="{{q}}" onChange="{{onQ}}" placeholder="{{t.searchPh}}" aria-label="{{t.search}}" style="flex: 1; min-width: 0; height: 44px; border: none; background: none; color: #26303A; font-family: 'Onest', sans-serif; font-size: 16px; outline: none"></label>
</div>

<div style="display: flex; gap: 8px; padding: 10px 16px 0">
<button onClick="{{toggleFilters}}" aria-expanded="{{filtersOpen}}" style="flex: 1; height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid {{fBorder}}; background: {{fBg}}; color: #26303A; border-radius: 12px; font-family: 'Onest', sans-serif; font-size: 15px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>{{t.filters}}<sc-if value="{{hasChips}}" hint-placeholder-val="{{false}}"><span class="mono" style="background: #46596A; color: #F5F2EF; font-size: 11px; border-radius: 999px; padding: 0 6px">{{chipCount}}</span></sc-if></button>
<button onClick="{{toggleSort}}" aria-expanded="{{sortOpen}}" style="flex: 1; height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid {{sBorder}}; background: {{sBg}}; color: #26303A; border-radius: 12px; font-family: 'Onest', sans-serif; font-size: 15px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"></path></svg>{{sortLabel}}</button>
</div>

<sc-if value="{{sortOpen}}" hint-placeholder-val="{{false}}">
<div class="pop" role="radiogroup" aria-label="{{t.sort}}" style="margin: 8px 16px 0; border: 1px solid #AEBCC5; border-radius: 18px; overflow: hidden">
<sc-for list="{{sorts}}" as="o" hint-placeholder-count="3">
<button role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="width: 100%; min-height: 48px; padding: 0 14px; display: flex; justify-content: space-between; align-items: center; border: none; border-bottom: 1px solid #C3CED5; background: {{o.bg}}; color: {{o.fg}}; font-family: 'Onest', sans-serif; font-size: 15px; text-align: left">{{o.label}}<span aria-hidden="true">{{o.mark}}</span></button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{filtersOpen}}" hint-placeholder-val="{{false}}">
<div class="pop" style="margin: 8px 16px 0; border: 1px solid #AEBCC5; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 20px; background: #E6ECEF">
<div style="display: flex; flex-direction: column; gap: 8px">
<span class="lbl">{{t.fLayer}}</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{layers}}" as="l" hint-placeholder-count="4">
<button onClick="{{l.toggle}}" aria-pressed="{{l.on}}" style="height: 40px; padding: 0 12px; border: 1px solid {{l.border}}; background: {{l.bg}}; color: {{l.fg}}; border-radius: 999px; font-family: 'Onest', sans-serif; font-size: 13px">{{l.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="mtemp" class="lbl">{{t.fTemp}}</label>
<input id="mtemp" type="range" min="-15" max="20" step="1" value="{{tempVal}}" onChange="{{onTemp}}" aria-valuetext="{{tempLabel}}" style="accent-color: #46596A; width: 100%">
<div class="mono" style="display: flex; justify-content: space-between; font-size: 11px; color: #56636E"><span>−15 °C</span><span style="color: #46596A; font-size: 13px">{{tempLabel}}</span><span>+20 °C</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span class="lbl">{{t.fSize}}</span>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{sizes}}" as="z" hint-placeholder-count="6">
<button onClick="{{z.pick}}" aria-pressed="{{z.on}}" class="mono" style="height: 44px; border: 1px solid {{z.border}}; background: none; color: {{z.fg}}; border-radius: 12px; font-size: 12px">{{z.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span class="lbl">{{t.fColor}}{{colorName}}</span>
<div style="display: flex; gap: 12px">
<sc-for list="{{colors}}" as="c" hint-placeholder-count="4">
<button onClick="{{c.pick}}" aria-pressed="{{c.on}}" aria-label="{{c.label}}" style="width: 44px; height: 44px; border-radius: 50%; background: {{c.hex}}; border: {{c.ring}}; box-shadow: {{c.halo}}"></button>
</sc-for>
</div>
</div>
<div style="display: flex; gap: 8px">
<button onClick="{{resetAll}}" style="flex: 1; height: 48px; border: 1px solid #AEBCC5; background: none; color: #26303A; border-radius: 12px; font-family: 'Onest', sans-serif; font-size: 15px">{{t.reset}}</button>
<button onClick="{{toggleFilters}}" class="cta" style="flex: 1; height: 48px; border: none; background: #46596A; color: #F5F2EF; border-radius: 12px; font-family: 'Onest', sans-serif; font-size: 15px; font-weight: 600">{{showLabel}}</button>
</div>
</div>
</sc-if>

<div style="padding: 12px 16px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
<span class="mono" style="font-size: 12px; color: #56636E; margin-right: 4px">{{foundLabel}}</span>
<sc-for list="{{chips}}" as="c" hint-placeholder-count="0">
<button onClick="{{c.remove}}" aria-label="{{c.aria}}" class="mono" style="height: 32px; padding: 0 10px; border: 1px solid #AEBCC5; background: none; color: #26303A; border-radius: 12px; font-size: 12px; display: flex; align-items: center; gap: 6px">{{c.label}} <span aria-hidden="true" style="color: #56636E">×</span></button>
</sc-for>
</div>

<sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
<div style="margin: 20px 16px 0; border: 1px dashed #AEBCC5; border-radius: 18px; padding: 40px 16px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
<span style="font-family: 'Rubik Spray Paint', cursive; color: #46596A; font-size: 32px; transform: rotate(-4deg)">{{t.emptySpray}}</span>
<p style="margin: 0; font-size: 15px; color: #3E4A55">{{t.emptyText}}</p>
<button onClick="{{resetAll}}" class="cta" style="height: 48px; padding: 0 24px; background: #46596A; color: #F5F2EF; border: none; border-radius: 12px; font-family: 'Onest', sans-serif; font-size: 15px; font-weight: 600">{{t.reset}}</button>
</div>
</sc-if>

<div style="padding: 20px 16px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 10px">
<sc-for list="{{products}}" as="p" hint-placeholder-count="8">
<a href="Mobile-Product.dc.html" class="card" style="display: flex; flex-direction: column; gap: 6px">
<div style="position: relative">
<img data-dc-src="{{p.img}}" alt="{{p.name}}" style="display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 14px">
<span class="mono" style="position: absolute; left: 8px; top: 8px; background: #D9E2E7; border: 1px solid #AEBCC5; padding: 3px 6px; font-size: 10px; border-radius: 6px; color: #26303A">{{p.layer}}</span>
</div>
<span style="font-size: 14px; font-weight: 500">{{p.name}}</span>
<span style="font-size: 14px">{{p.price}}</span>
<span class="mono" style="font-size: 11px; color: #56636E">{{p.temp}}</span>
</a>
</sc-for>
</div>

<sc-if value="{{hasMore}}" hint-placeholder-val="{{true}}">
<div style="padding: 32px 16px 0"><button onClick="{{showMore}}" style="width: 100%; height: 52px; border: 1px solid #26303A; background: none; color: #26303A; border-radius: 12px; font-family: 'Onest', sans-serif; font-size: 15px">{{moreLabel}}</button></div>
</sc-if>
<div style="height: 48px"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":2600}}'>
class Component extends DCLogic {
  loadLang() { try { return localStorage.getItem('shar-lang') || 'uk'; } catch (e) { return 'uk'; } }
  defaultItems() { return [{ id: 'ls', color: 'g', size: 'M', qty: 1 }, { id: 'fl', color: 'g', size: 'M', qty: 1 }, { id: 'so', color: 'c', size: '42–44', qty: 1 }]; }
  loadItems() { try { const v = JSON.parse(localStorage.getItem('shar-items')); if (Array.isArray(v)) return v; } catch (e) {} return this.defaultItems(); }
  saveItems(items) { try { localStorage.setItem('shar-items', JSON.stringify(items)); } catch (e) {} }
  loadCart() { return this.loadItems().reduce((s, i) => s + i.qty, 0); }
  addItem(it, d) { const step = d || 1; const items = this.loadItems(); const k = items.findIndex((x) => x.id === it.id && x.color === it.color && x.size === it.size); if (k >= 0) items[k] = Object.assign({}, items[k], { qty: items[k].qty + step }); else if (step > 0) items.push(Object.assign({ qty: 1 }, it)); const next = items.filter((x) => x.qty > 0); this.saveItems(next); return next.reduce((s, i) => s + i.qty, 0); }
  storeOk() { try { localStorage.setItem('shar-t', '1'); localStorage.removeItem('shar-t'); return true; } catch (e) { return false; } }
  componentDidMount() { if (!this.storeOk()) return; this._sync = setInterval(() => { const c = this.loadCart(), l = this.loadLang(); if (c !== this.state.cart || l !== this.state.lang) this.setState({ cart: c, lang: l }); }, 700); }
  componentWillUnmount() { clearInterval(this._sync); }
  setLang(l) { try { localStorage.setItem('shar-lang', l); } catch (e) {} this.setState({ lang: l }); }
  navVals(uk, active) {
    const items = [['home', 'Mobile-Main.dc.html', uk ? 'Про Shar' : 'About Shar'], ['catalog', 'Mobile-Catalog.dc.html', uk ? 'Каталог' : 'Shop'], ['builder', 'Mobile-Builder.dc.html', uk ? 'Конструктор шарів' : 'Layer builder'], ['cart', 'Mobile-Cart.dc.html', uk ? 'Кошик' : 'Cart']];
    return {
      mm: { lang: uk ? 'Мова' : 'Language', cart: uk ? 'Кошик' : 'Cart', menu: uk ? 'Меню' : 'Menu' },
      menuItems: items.map(([k, href, label]) => ({ href, label, cur: k === active ? 'page' : 'false', color: k === active ? '#46596A' : '#26303A' })),
      menuOpen: !!this.state.menu, menuColor: this.state.menu ? '#46596A' : '#26303A', toggleMenu: () => this.setState({ menu: !this.state.menu }),
      cartCount: this.state.cart, isUk: uk, isEn: !uk,
      ukBg: uk ? '#46596A' : 'transparent', ukFg: uk ? '#F5F2EF' : '#26303A', enBg: uk ? 'transparent' : '#46596A', enFg: uk ? '#26303A' : '#F5F2EF',
      setUk: () => this.setLang('uk'), setEn: () => this.setLang('en')
    };
  }
  constructor(props) {
    super(props);
    this.state = { lang: this.loadLang(), cart: this.loadCart(), menu: false, fo: false, so: false, sc: 0, temp: null, l1: false, l2: false, l3: false, acc: false, size: null, color: null, q: '', sort: 'pop', more: false };
  }
  data() {
    const B = (id) => '/_blob/' + id;
    return [
      ['Фліс Затишок', 'Cozy Fleece', 2390, 4, 14, 'l2', 'gcm', '06.jpg'],
      ['Жилет Пуфер', 'Puffer Vest', 2190, 2, 14, 'l2', 'cg', '11.jpg'],
      ['Пончо-плед', 'Blanket Poncho', 2890, 0, 12, 'l3', 'mg', '17.jpg'],
      ['Лонгслів База', 'Base Longsleeve', 1290, 10, 18, 'l1', 'gmn', '03.jpg'],
      ['Рукавички Сенсор', 'Touch Gloves', 490, -10, 10, 'acc', 'g', '21.jpg'],
      ['Фліс Затишок Худі', 'Cozy Fleece Hoodie', 2590, 4, 14, 'l2', 'gcn', '09.jpg'],
      ['Світшот Теплий', 'Warm Sweatshirt', 1790, 8, 16, 'l2', 'gcnm', '14.jpg'],
      ['Куртка Вітер', 'Wind Jacket', 4890, -15, 5, 'l3', 'gn', '18.jpg'],
      ['Термокомплект Ніч', 'Night Thermal Set', 1790, 6, 16, 'l1', 'gn', '05.jpg'],
      ['Фліс Мікро', 'Micro Fleece', 1590, 8, 17, 'l2', 'gcnm', '10.jpg'],
      ['Жилет Тиша', 'Quiet Vest', 1990, 6, 16, 'l2', 'gn', '12.jpg'],
      ['Жилет Довгий', 'Long Vest', 2490, 2, 12, 'l2', 'gc', '13.jpg'],
      ['Світшот Хвиля', 'Wave Sweatshirt', 1890, 8, 16, 'l2', 'gcm', '15.jpg'],
      ['Кардиган Флісовий', 'Fleece Cardigan', 2290, 6, 15, 'l2', 'mcg', '16.jpg'],
      ['Штани Утеплені Місто', 'City Insulated Trousers', 2690, -10, 10, 'l3', 'gc', '19.jpg'],
      ['Термошкарпетки', 'Thermal Socks', 390, -10, 12, 'acc', 'cg', '20.jpg'],
      ['Футболка База', 'Base Tee', 890, 14, 20, 'l1', 'gm', '04.jpg'],
      ['Сумка Павербанк', 'Power Bank Bag', 1490, -30, 30, 'acc', 'g', '22.jpg']
    ];
  }
  renderVals() {
    const S = this.state;
    const uk = S.lang === 'uk';
    const t = uk ? {
      crumbs: 'Хлібні крихти', home: 'Головна', title: 'Каталог', scenario: 'Сценарій', search: 'Пошук', searchPh: 'Фліс, жилет, шкарпетки…',
      filters: 'Фільтри', sort: 'Сортування', fLayer: 'ШАР', fTemp: 'ТЕМПЕРАТУРА, ДЕ НОСИТИМЕШ', fSize: 'РОЗМІР', fColor: 'КОЛІР',
      reset: 'Скинути все', emptySpray: 'тут холодно', emptyText: 'Під ці фільтри нічого не знайшлося. Спробуй іншу температуру.'
    } : {
      crumbs: 'Breadcrumbs', home: 'Home', title: 'Shop', scenario: 'Scenario', search: 'Search', searchPh: 'Fleece, vest, socks…',
      filters: 'Filters', sort: 'Sort', fLayer: 'LAYER', fTemp: 'TEMPERATURE WHERE YOU’LL WEAR IT', fSize: 'SIZE', fColor: 'COLOR',
      reset: 'Clear all', emptySpray: 'it’s cold here', emptyText: 'Nothing matches these filters. Try another temperature.'
    };
    const price = (n) => uk ? String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' грн' : 'UAH ' + n.toLocaleString('en-US');
    const ft = (n) => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n);
    const LAYER = { l1: uk ? 'ШАР 01' : 'LAYER 01', l2: uk ? 'ШАР 02' : 'LAYER 02', l3: uk ? 'ШАР 03' : 'LAYER 03', acc: uk ? 'АКСЕСУАР' : 'ACCESSORY' };
    const LNAME = { l1: uk ? '01 · Термобаза' : '01 · Base', l2: uk ? '02 · Утеплення' : '02 · Mid', l3: uk ? '03 · Захист' : '03 · Outer', acc: uk ? 'Аксесуари' : 'Accessories' };
    const COL = { g: ['#3A3E44', uk ? 'Графіт' : 'Graphite'], c: ['#7C8086', uk ? 'Бетон' : 'Concrete'], n: ['#1F2A3D', uk ? 'Нічний синій' : 'Night blue'], m: ['#E6E1D8', uk ? 'Молочний' : 'Milk white'] };
    const SORTS = { pop: uk ? 'Популярні' : 'Popular', warm: uk ? 'Найтепліші' : 'Warmest', price: uk ? 'Дешевші' : 'Price: low' };
    const all = this.data();
    const selLayers = ['l1', 'l2', 'l3', 'acc'].filter((k) => S[k]);
    const q = S.q.trim().toLowerCase();
    let list = all.filter((p) =>
      (selLayers.length === 0 || selLayers.includes(p[5])) &&
      (S.temp === null || (p[3] <= S.temp && S.temp <= p[4])) &&
      (S.color === null || p[6].includes(S.color)) &&
      (!q || p[0].toLowerCase().includes(q) || p[1].toLowerCase().includes(q)));
    if (S.sort === 'warm') list = list.slice().sort((a, b) => a[3] - b[3]);
    if (S.sort === 'price') list = list.slice().sort((a, b) => a[2] - b[2]);
    const shown = S.more ? list : list.slice(0, 8);
    const pill = (on) => ({ bg: on ? '#46596A' : 'transparent', fg: on ? '#F5F2EF' : '#26303A', border: on ? '#46596A' : '#AEBCC5' });
    const scLabels = uk ? ['Усе', 'Вдома', 'Офіс', 'Місто', 'Укриття'] : ['All', 'At home', 'Office', 'City', 'Shelter'];
    const scTemps = [null, 14, 16, -8, 10];
    const chips = [];
    selLayers.forEach((k) => chips.push({ label: LNAME[k], remove: () => this.setState({ [k]: false }) }));
    if (S.temp !== null) chips.push({ label: ft(S.temp) + ' °C', remove: () => this.setState({ temp: null, sc: 0 }) });
    if (S.size) chips.push({ label: S.size, remove: () => this.setState({ size: null }) });
    if (S.color) chips.push({ label: COL[S.color][1], remove: () => this.setState({ color: null }) });
    if (q) chips.push({ label: '«' + S.q + '»', remove: () => this.setState({ q: '' }) });
    chips.forEach((c) => { c.aria = (uk ? 'Прибрати фільтр ' : 'Remove filter ') + c.label; });
    const found = list.length;
    return Object.assign(this.navVals(uk, 'catalog'), {
      t,
      scenarios: scLabels.map((label, i) => Object.assign({ label, on: S.sc === i, pick: () => this.setState({ sc: i, temp: scTemps[i] }) }, pill(S.sc === i))),
      q: S.q, onQ: (e) => this.setState({ q: e.target.value }),
      filtersOpen: S.fo, toggleFilters: () => this.setState({ fo: !S.fo, so: false }), fBorder: S.fo ? '#46596A' : '#AEBCC5', fBg: S.fo ? '#EADFD8' : '#E6ECEF',
      sortOpen: S.so, toggleSort: () => this.setState({ so: !S.so, fo: false }), sBorder: S.so ? '#46596A' : '#AEBCC5', sBg: S.so ? '#EADFD8' : '#E6ECEF', sortLabel: SORTS[S.sort],
      sorts: ['pop', 'warm', 'price'].map((k) => ({ label: SORTS[k], on: S.sort === k, mark: S.sort === k ? '✓' : '', bg: S.sort === k ? '#EADFD8' : 'transparent', fg: S.sort === k ? '#46596A' : '#26303A', pick: () => this.setState({ sort: k, so: false }) })),
      layers: ['l1', 'l2', 'l3', 'acc'].map((k) => Object.assign({ label: LNAME[k], on: S[k], toggle: () => this.setState({ [k]: !S[k] }) }, pill(S[k]))),
      tempVal: S.temp === null ? 14 : S.temp, tempLabel: S.temp === null ? (uk ? 'будь-яка' : 'any') : ft(S.temp) + ' °C',
      onTemp: (e) => this.setState({ temp: parseInt(e.target.value, 10), sc: 0 }),
      sizes: ['XS', 'S', 'M', 'L', 'XL', 'XXL'].map((z) => ({ label: z, on: S.size === z, pick: () => this.setState({ size: S.size === z ? null : z }), fg: S.size === z ? '#46596A' : '#26303A', border: S.size === z ? '#46596A' : '#AEBCC5' })),
      colors: ['g', 'c', 'n', 'm'].map((k) => ({ label: COL[k][1], hex: COL[k][0], on: S.color === k, ring: S.color === k ? '2px solid #E6ECEF' : '1px solid #AEBCC5', halo: S.color === k ? '0 0 0 2px #46596A' : 'none', pick: () => this.setState({ color: S.color === k ? null : k }) })),
      colorName: S.color ? ' · ' + COL[S.color][1] : '',
      chips, hasChips: chips.length > 0, chipCount: chips.length,
      resetAll: () => this.setState({ sc: 0, temp: null, l1: false, l2: false, l3: false, acc: false, size: null, color: null, q: '', more: false }),
      showLabel: uk ? 'Показати ' + found : 'Show ' + found,
      foundLabel: uk ? 'Знайдено: ' + found : found + ' found',
      isEmpty: found === 0,
      products: shown.map((p) => ({ name: uk ? p[0] : p[1], price: price(p[2]), img: p[7], layer: LAYER[p[5]], temp: p[4] >= 30 ? (uk ? 'будь-яка погода' : 'any weather') : ft(p[3]) + '…' + ft(p[4]) + ' °C' })),
      hasMore: !S.more && list.length > 8, showMore: () => this.setState({ more: true }),
      moreLabel: uk ? 'Показати ще ' + (list.length - 8) : 'Show ' + (list.length - 8) + ' more'
    });
  }
}
</script>
